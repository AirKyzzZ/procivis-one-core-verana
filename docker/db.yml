name: core
services:
  mariadb:
    image: mariadb:12.0.2
    ports:
      - 3306:3306
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: Qpq5nDb5MKD6v9bt8dPD
      MYSQL_PASSWORD: 886eOqVMmlHsayu6Vyxw
      MYSQL_USER: core
      MYSQL_DATABASE: core
    restart: on-failure

# Template when using postgres
#  postgresdb:
#    image: postgres:18.3
#    ports:
#      - 5432:5432
#    environment:
#      POSTGRES_PASSWORD: 886eOqVMmlHsayu6Vyxw
#      POSTGRES_USER: core
#      POSTGRES_DB: core
#    restart: on-failure

  walletdb:
    image: mariadb:12.0.2
    ports:
      - 3307:3306
    volumes:
      - mariadb_data:/var/lib/mysql2
    environment:
      MYSQL_ROOT_PASSWORD: Qpq5nDb5MKD6v9bt8dPD
      MYSQL_PASSWORD: 886eOqVMmlHsayu6Vyxw
      MYSQL_USER: core
      MYSQL_DATABASE: core
    restart: on-failure

volumes:
  mariadb_data:
