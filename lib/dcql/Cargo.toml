[package]
description            = "Digital Credentials Query Language (DCQL) implementation"
edition                = "2024"
license                = "Apache-2.0"
name                   = "dcql"
publish                = false
rust-version.workspace = true
version                = "0.1.0"

[dependencies]
bon.workspace                = true
serde                        = { workspace = true, features = ["derive"] }
similar-asserts.workspace    = true
standardized-types.workspace = true
strum.workspace              = true
thiserror.workspace          = true
utoipa                       = { workspace = true, features = ["uuid"], optional = true }

[dev-dependencies]
serde_json      = "1.0"
similar-asserts = "1.5"
